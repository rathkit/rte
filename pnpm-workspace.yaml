packages:
  - packages/*

# Supply-chain hardening. Everything in node_modules is a dev tool; nothing here ships.
# nx postinstall only updates the Nx Cloud client, which we do not use (reviewed 2026-10-20).
allowBuilds:
  nx: false
minimumReleaseAge: 4320
strictDepBuilds: true

# Peer dependencies are optional and never installed here: wrappers are tested against stand-ins, so no framework enters the lockfile.
autoInstallPeers: false

# Patched versions of two packages that nx (a development tool, never shipped) pulls in, until nx itself moves to them.
overrides:
  undici: ">=7.30.1 <8"
  minimatch: ">=11.0.1 <12"
