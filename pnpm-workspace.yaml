packages:
  - packages/*

# Supply-chain hardening. Everything in node_modules is a dev tool; nothing here ships.
# nx postinstall only updates the Nx Cloud client, which we do not use (reviewed 2026-10-20).
allowBuilds:
  nx: false
minimumReleaseAge: 4320
strictDepBuilds: true

# Peer dependencies are optional and never installed here: wrappers are tested against stand-ins, so no framework enters the lockfile.
autoInstallPeers: false

# A patched version of a package that nx (a development tool, never shipped) pulls in, until nx itself moves to it.
# minimatch is not moved: nx calls minimatch.makeRe, which minimatch 11 no longer has, so 'pnpm release' stops working
# with it. There is no patched 10.x, and nx matches only fixed patterns with it.
overrides:
  undici: ">=7.30.1 <8"
