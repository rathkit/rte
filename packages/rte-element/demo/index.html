<!doctype html>
<meta charset="utf-8">
<title>rte-editor demo</title>
<script type="importmap">
{ "imports": {
  "@rathkit/rte-core/standard": "/dist/standard/index.js",
  "@rathkit/rte-core/dom": "/dist/dom/index.js",
  "@rathkit/rte-headless": "/headless/dist/index.js",
  "@rathkit/rte-element": "/element/dist/index.js"
} }
</script>
<form id="f">
  <rte-toolbar for="body"></rte-toolbar>
  <rte-editor id="body" name="body" label="Body" value="&lt;p&gt;Hello&lt;/p&gt;"></rte-editor>
  <rte-editor id="second" name="second" label="Second"><p>from children</p></rte-editor>
  <rte-editor id="limited" name="limited" label="Limited" placeholder="Write something" maxlength="10" spellcheck="false"></rte-editor>
  <rte-editor id="req" name="req" label="Required" required></rte-editor>
  <button type="reset" id="reset">Reset</button>
</form>
<script type="module">
import { define } from "@rathkit/rte-element";
window.__events = [];
document.addEventListener("rte-change", (e) => window.__events.push(["rte-change", e.target.id, e.detail.html]));
document.addEventListener("input", (e) => window.__events.push(["input", e.target.id]));
document.addEventListener("change", (e) => window.__events.push(["change", e.target.id]));
for (const name of ["rte-focus", "rte-blur"]) document.addEventListener(name, (e) => window.__events.push([name, e.target.id]));
document.addEventListener("rte-selection", (e) => window.__events.push(["rte-selection", e.target.id, e.detail.selection && e.detail.selection.anchor ? "ok" : "bad"]));
document.addEventListener("rte-ready", (e) => window.__events.push(["rte-ready", e.target.id]));
define();
await Promise.all(["body", "second", "req"].map((id) => document.getElementById(id).whenReady()));
window.__elementReady = true;
</script>
