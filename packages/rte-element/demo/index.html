<!doctype html>
<meta charset="utf-8">
<title>rk-editor demo</title>
<script type="importmap">
{ "imports": {
  "@rathkit/rte-core/standard": "/dist/standard/index.js",
  "@rathkit/rte-core/dom": "/dist/dom/index.js",
  "@rathkit/rte-headless": "/headless/dist/index.js",
  "@rathkit/rte-element": "/element/dist/index.js"
} }
</script>
<form id="f">
  <rk-toolbar for="body"></rk-toolbar>
  <rk-editor id="body" name="body" label="Body" value="&lt;p&gt;Hello&lt;/p&gt;"></rk-editor>
  <rk-editor id="second" name="second" label="Second"><p>from children</p></rk-editor>
  <rk-editor id="limited" name="limited" label="Limited" placeholder="Write something" maxlength="10" spellcheck="false"></rk-editor>
  <rk-editor id="req" name="req" label="Required" required></rk-editor>
  <button type="reset" id="reset">Reset</button>
</form>
<script type="module">
import { define } from "@rathkit/rte-element";
window.__events = [];
document.addEventListener("rk-change", (e) => window.__events.push(["rk-change", e.target.id, e.detail.html]));
document.addEventListener("input", (e) => window.__events.push(["input", e.target.id]));
document.addEventListener("change", (e) => window.__events.push(["change", e.target.id]));
document.addEventListener("rk-ready", (e) => window.__events.push(["rk-ready", e.target.id]));
define();
await Promise.all(["body", "second", "req"].map((id) => document.getElementById(id).whenReady()));
window.__elementReady = true;
</script>
