name: ci

# A change that only touches the root documents (README, changelog and the like), docs/, licenses or the community files runs nothing when pushed. A pull request always runs the checks, because branch protection requires them and a skipped workflow never reports. The checks that read those files
# (the word and secret scans) run again on the next change to anything else, on every release, and on the history scan.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE*"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release dry run below reads the commits since the last tag.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The oldest Node that `engines` allows, kept for the import checks of the packed packages (check:packages).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
      - name: Remember the oldest Node
        run: echo "RTE_SMOKE_NODES=$(command -v node)" >> "$GITHUB_ENV"
      # pnpm, the Node in .node-version, and the install from the lockfile, in one step.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          cache: true
          require-lockfile: true
      - run: pnpm check:zero-deps
      - run: pnpm check:secrets
      - run: pnpm check:denylist
        env:
          RATHKIT_DENYLIST: ${{ secrets.RATHKIT_DENYLIST }}
          RATHKIT_DENYLIST_COMPAT_ALLOW: ${{ secrets.RATHKIT_DENYLIST_COMPAT_ALLOW }}
      - run: pnpm check:graph
      - run: pnpm check:fixtures
      - run: pnpm test:tools
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:size
      # The public surface: every name each package exports, against the list checked in (tools/exports.snapshot.txt).
      - run: pnpm check:exports
      # What would be published: packed, installed together from the tarballs, imported and type-checked. Nothing is published.
      - run: pnpm check:packages
      # The release tooling still works with the installed dev tools (a patched dependency once broke it unseen). Nothing is written.
      - run: pnpm release:dry

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      # The browser driver is not a dependency of the workspace: it is a project of its own (tools/browser-checks) whose lockfile pins the
      # exact tarball by its sha512 hash. Installed without install scripts; fetching the browsers is a separate, explicit command.
      # The browsers are kept between runs, keyed by the driver's lockfile (which pins their version), so they are downloaded only when it changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/browser-checks/pnpm-lock.yaml') }}
      - name: Install the browser driver and the browsers
        working-directory: tools/browser-checks
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      # The checks run with the network switched off, in a new network namespace; this runner image restricts those by default.
      - name: Allow unprivileged network namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: tools/browser-checks/run.sh
        env:
          RTE_PLAYWRIGHT: ${{ github.workspace }}/tools/browser-checks/node_modules
          # Shared runners are slower and noisier than a desk, so the speed budgets are doubled here.
          RTE_SPEED_SCALE: "2"
