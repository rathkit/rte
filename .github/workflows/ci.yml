name: ci

# A change that only touches the root documents (README, changelog and the like), docs/, licenses or the community files runs nothing when pushed. A pull request always runs the checks, because branch protection requires them and a skipped workflow never reports. The checks that read those files
# (the word and secret scans) run again on the next change to anything else, on every release, and on the history scan.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE*"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release dry run below reads the commits since the last tag.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The oldest Node that `engines` allows, kept for the import checks of the packed packages (check:packages).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
      - name: Remember the oldest Node
        run: echo "RTE_SMOKE_NODES=$(command -v node)" >> "$GITHUB_ENV"
      # pnpm, the Node in .node-version, and the install from the lockfile, in one step.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          cache: true
          require-lockfile: true
      - run: pnpm check:zero-deps
      - run: pnpm check:secrets
      - run: pnpm check:denylist
        env:
          RATHKIT_DENYLIST: ${{ secrets.RATHKIT_DENYLIST }}
          RATHKIT_DENYLIST_COMPAT_ALLOW: ${{ secrets.RATHKIT_DENYLIST_COMPAT_ALLOW }}
      - run: pnpm check:graph
      - run: pnpm check:fixtures
      - run: pnpm test:tools
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The test message packs against every word the built editor says: no key missing or unused, plural forms as the language has them.
      - run: pnpm check:messages
      - run: pnpm check:size
      # The public surface: every name each package exports, against the list checked in (tools/exports.snapshot.txt).
      - run: pnpm check:exports
      # What would be published: packed, installed together from the tarballs, imported and type-checked. Nothing is published.
      - run: pnpm check:packages
      # The release tooling still works with the installed dev tools (a patched dependency once broke it unseen). Nothing is written.
      - run: pnpm release:dry

  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      # The browser driver is not a dependency of the workspace: it is a project of its own (tools/browser-checks) whose lockfile pins the
      # exact tarball by its sha512 hash. Installed without install scripts; fetching the browsers is a separate, explicit command.
      # The browsers are kept between runs, keyed by the driver's lockfile (which pins their version), so they are downloaded only when it changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.os }}-${{ hashFiles('tools/browser-checks/pnpm-lock.yaml') }}
      - name: Install the browser driver and the browsers
        working-directory: tools/browser-checks
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      # The checks run with the network switched off, in a new network namespace; this runner image restricts those by default.
      - name: Allow unprivileged network namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: tools/browser-checks/run.sh
        env:
          RTE_PLAYWRIGHT: ${{ github.workspace }}/tools/browser-checks/node_modules
          # Shared runners are slower and noisier than a desk, so the speed budgets are doubled here.
          RTE_SPEED_SCALE: "2"
      # Editors made and destroyed thousands of times, in all three engines (docs/LEAKS.md): nothing may be left on the page.
      - run: tools/leak/run.sh
        env:
          RTE_PLAYWRIGHT: ${{ github.workspace }}/tools/browser-checks/node_modules

  # The benchmark harness lives in its own repository (rathkit/rte-bench) and runs here in its pinned, offline container. tools/bench.ref names the commit
  # of that repository this change is gated by. The gate builds this commit and the one it builds on, measures both twice, fails when this commit is
  # over a budget (tools/bench/budgets.json) or a figure got slower or larger than on the base by more than the allowance, and lists what was accepted
  # (tools/bench/accepted.json). The runner image is pinned because the machine class is part of the method; budgets are widened three times for a shared runner.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # What this change builds on: the base of a pull request, or the commit before a push. Empty when there is none (a new branch).
      BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      - name: Read the benchmark repository commit
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < tools/bench.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rathkit/rte-bench
          ref: ${{ steps.ref.outputs.sha }}
          path: rte-bench
          persist-credentials: false
      # The base commit, built beside this one. Both are mounted read-only into the container and measured with the same harness.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BASE_SHA != ''
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Build the base commit
        if: env.BASE_SHA != ''
        working-directory: base
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm build
          cp ../tools/conformance/serve.mjs tools/conformance/serve.mjs
      - name: Run the gate in the container
        if: env.BASE_SHA != ''
        env:
          CPUSET: "0-3"
          MEMORY: 8g
          GATE_CLASS: GitHub-hosted ubuntu-24.04 runner
        run: rte-bench/container/run.sh gate --rte . --base base --limits tools/bench --scale 3
      - name: Check the budgets only
        if: env.BASE_SHA == ''
        env:
          CPUSET: "0-3"
          MEMORY: 8g
        run: rte-bench/container/run.sh run --rte . --limits tools/bench -- --quick --scale 3 --class "GitHub-hosted ubuntu-24.04 runner"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: rte-bench/results/*.json
          if-no-files-found: ignore
          retention-days: 30

  # The oldest engines in the support window (docs/SUPPORT.md, "Support window"): the same browser checks, with the browsers of the Playwright release
  # before the one in tools/browser-checks. That driver is a project of its own too (tools/browser-checks/oldest), its lockfile pinning the exact tarball.
  browsers-oldest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-oldest-ubuntu-24.04-${{ runner.os }}-${{ hashFiles('tools/browser-checks/oldest/pnpm-lock.yaml') }}
      - name: Install the older browser driver and its browsers
        working-directory: tools/browser-checks/oldest
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Allow unprivileged network namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: tools/browser-checks/run.sh
        env:
          RTE_PLAYWRIGHT: ${{ github.workspace }}/tools/browser-checks/oldest/node_modules
          RTE_SPEED_SCALE: "2"
