name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:zero-deps
      - run: pnpm check:denylist
        env:
          RTE_DENYLIST: ${{ secrets.RTE_DENYLIST }}
          RTE_DENYLIST_COMPAT_ALLOW: ${{ secrets.RTE_DENYLIST_COMPAT_ALLOW }}
      - run: pnpm check:graph
      - run: pnpm check:fixtures
      - run: pnpm test:tools
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:size

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser driver is not a dependency of the workspace: it is a project of its own (tools/browser-checks) whose lockfile pins the
      # exact tarball by its sha512 hash. Installed without install scripts; fetching the browsers is a separate, explicit command.
      - name: Install the browser driver and the browsers
        working-directory: tools/browser-checks
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      # The checks run with the network switched off, in a new network namespace; this runner image restricts those by default.
      - name: Allow unprivileged network namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: tools/browser-checks/run.sh
        env:
          RTE_PLAYWRIGHT: ${{ github.workspace }}/tools/browser-checks/node_modules
          # Shared runners are slower and noisier than a desk, so the speed budgets are doubled here.
          RTE_SPEED_SCALE: "2"
