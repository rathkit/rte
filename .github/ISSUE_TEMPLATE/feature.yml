name: Feature request
description: Suggest something Rathkit RTE should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, then any solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
