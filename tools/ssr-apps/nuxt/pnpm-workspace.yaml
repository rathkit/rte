# A project of its own, so Nuxt never enters the main lockfile. The same supply-chain rules as the main workspace apply.
packages: []
minimumReleaseAge: 4320
strictDepBuilds: true
autoInstallPeers: false
# Newer than what the dependencies ask for, to take the fixes for published advisories (vite 8.3.3, glob 14.0.2, minimatch 11.0.1).
overrides:
  glob: 14.0.4
  minimatch: 11.0.4
